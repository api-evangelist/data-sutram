aid: data-sutram
name: Data Sutram
description: >-
  Data Sutram is an enterprise AI trust platform for the financial services
  sector, using external and alternative data intelligence plus agentic
  workflows to power fraud detection, identity and address verification, credit
  assessment, and collections. Its products - Trust (fraud and trust scoring),
  Auth (authentication and verification), and Echo (collections intelligence) -
  are applied across the customer lifecycle from acquisition and onboarding
  through portfolio monitoring and debt recovery. Data Sutram serves leading
  Indian banks and fintechs including HDFC, Axis, ICICI, Kotak, IndusInd,
  Jupiter, Navi, and Fibe, and maintains ISO 27001, ISO 27018, and SOC 2
  certifications along with DPDP compliance. The company was surfaced as a
  portfolio company of Lightspeed Venture Partners and is also backed by
  B Capital.
